<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Öğrenci Bilgi Sistemi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --navy:#1E2A38;--ink:#0D1B2A;--muted:#5C6F82;--gold:#C9A86A;--gold-line:rgba(184,134,11,.30);
  --page:#F4F7FB;--panel:#fff;--line:rgba(13,27,42,.08);--cell:#E6EBF1;--th:#F5F7FA;--cellbg:#f3faff;--text2:#4B5563;
  --primary:#0d6efd;--success:#198754;--warning:#d97706;--danger:#dc3545;--info:#0aa2c0;
  --shadow:0 4px 24px rgba(13,27,42,.09);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:13px/1.5 "Open Sans",Tahoma,Geneva,Verdana,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}

/* ---- ÜST BAR ---- */
.topbar{position:fixed;inset:0 0 auto 0;height:60px;background:var(--navy);display:flex;align-items:center;gap:12px;padding:0 16px;z-index:40}
.hamb{background:none;border:0;color:#fff;font-size:19px;cursor:pointer;padding:1px 6px}
.brand-text{color:#fff;font-size:15.2px;font-weight:400;white-space:nowrap}
.sem-badge{background:rgba(255,255,255,.09);border:1px solid rgba(184,134,11,.35);color:#fff;font-size:10.7px;font-weight:500;border-radius:4px;padding:2px 9px;white-space:nowrap}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:8px}
.tb-btn{width:34px;height:34px;border-radius:8px;background:rgba(255,255,255,.07);border:0;color:#fff;cursor:pointer;position:relative;font-size:15px}
.notif{position:absolute;top:-5px;right:-4px;background:#E74C3C;color:#fff;font-size:9px;line-height:1;border-radius:999px;padding:3px 5px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.user-pill{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:999px;padding:4px 16px 4px 4px;color:#fff;font-size:12px;font-weight:500;white-space:nowrap}
.avatar{width:30px;height:30px;border-radius:50%;background:#cfd8e3;color:var(--navy);display:grid;place-items:center;font-size:14px;border:2px solid rgba(255,255,255,.5)}

/* ---- SOL MENÜ ---- */
aside{position:fixed;top:60px;left:0;bottom:0;width:250px;background:var(--navy);overflow-y:auto;padding:14px 6px 28px;z-index:35;transition:transform .2s}
aside::-webkit-scrollbar{width:6px}aside::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.logo{width:64px;height:64px;border-radius:50%;margin:0 auto;background:#fff;display:grid;place-items:center;box-shadow:0 0 0 3px rgba(255,255,255,.08)}
.logo span{width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a7bd5,#0b3d91);display:grid;place-items:center;color:#fff;font-size:22px}
.sys-name{margin:12px 8px 10px;text-align:center;color:#fff;font-size:12px;font-weight:600;background:rgba(255,255,255,.07);border-radius:8px;padding:6px}
.msearch{display:block;width:calc(100% - 18px);margin:0 9px 6px;background:rgba(255,255,255,.08);border:1px solid rgba(184,134,11,.25);border-radius:10px;padding:7px 9px;color:#fff;font-size:13px;outline:none}
.msearch::placeholder{color:rgba(255,255,255,.5)}
.nav-header{color:var(--gold);font-size:11.5px;padding:12px 12px 4px;letter-spacing:.02em}
.nav-link{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.68);font-size:12.8px;padding:6px 12px;border-radius:8px;cursor:pointer;user-select:none}
.nav-link i.ic{width:16px;text-align:center;font-size:12.5px}
.nav-link:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-link.active{background:rgba(201,168,106,.16);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
.nav-link .chev{margin-left:auto;font-size:10px;transition:transform .15s}
.nav-link.open .chev{transform:rotate(90deg)}
.nav-link .new{margin-left:auto;font-size:9px;font-weight:700;color:var(--navy);background:var(--gold);border-radius:4px;padding:1px 5px}
.subnav{padding-left:16px}
.subnav .nav-link{font-size:12px;padding:5px 12px}
.subnav .nav-link::before{content:"";width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.3);margin:0 5px 0 4px}
.backdrop{display:none}

/* ---- İÇERİK ---- */
.content{margin-left:250px;padding:76px 16px 56px;min-height:100vh}
.frame{background:var(--panel);border-radius:12px;padding:16px;min-height:calc(100vh - 140px)}
.sbar{position:fixed;left:250px;right:0;bottom:0;height:34px;background:#e8ecf1;border-top:1px solid #dde3ea;display:flex;align-items:center;justify-content:space-between;padding:0 16px;z-index:30;font-size:11px;color:var(--muted)}
.timer{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid #dde3ea;border-radius:999px;padding:2px 10px;font-variant-numeric:tabular-nums;color:var(--ink)}
@media (max-width:991px){
  aside{transform:translateX(-100%)}body.menu-open aside{transform:none}
  body.menu-open .backdrop{display:block;position:fixed;inset:60px 0 0 0;background:rgba(13,27,42,.4);z-index:34}
  .content{margin-left:0;padding:72px 10px 50px}.sbar{left:0}.frame{padding:12px}
}
@media (max-width:560px){.brand-text,.user-pill .uname{display:none}.user-pill{padding:4px}}

/* ---- BİLEŞENLER ---- */
.alert-premium{display:flex;align-items:flex-start;gap:12px;color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:16px;font-size:12.8px}
.alert-premium i.lead{margin-top:2px;font-size:15px}
.alert-premium .x{margin-left:auto;background:none;border:0;color:#fff;opacity:.8;cursor:pointer}
.ap-success{background:linear-gradient(90deg,#0F5132,#198754);box-shadow:0 4px 18px rgba(25,135,84,.22)}
.ap-warning{background:linear-gradient(90deg,#7c4a03,#d97706);box-shadow:0 4px 18px rgba(217,119,6,.22)}
.ap-danger{background:linear-gradient(90deg,#842029,#dc3545);box-shadow:0 4px 18px rgba(220,53,69,.22)}
.ap-info{background:linear-gradient(90deg,#0b3d91,#0d6efd);box-shadow:0 4px 18px rgba(13,110,253,.2)}
.icards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:20px}
@media (max-width:1100px){.icards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.icards{grid-template-columns:1fr}}
.info-card{position:relative;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:13px 13px 12px;overflow:hidden;display:flex;gap:12px;align-items:center;min-height:110px}
.info-card::before{content:"";position:absolute;inset:0 0 auto 0;height:3px;background:linear-gradient(90deg,var(--l1),var(--l2))}
.icon-wrap{width:34px;height:34px;border-radius:10px;background:var(--page);color:var(--navy);display:grid;place-items:center;font-size:15px;flex:none}
.ic-title{display:block;color:#3A3A3A;font-weight:700;font-size:12px;line-height:22px}
.ic-line{display:block;color:#3A3A3A;font-size:11.5px;line-height:21px}
.ic-big{font-size:22px;font-weight:700;color:var(--ink);line-height:1.2;font-variant-numeric:tabular-nums}
.qtitle{font-size:16px;font-weight:400;color:var(--navy);margin:4px 0 10px}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media (max-width:1100px){.quick{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){.quick{grid-template-columns:1fr}}
.quick-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;cursor:pointer;transition:transform .12s}
.quick-item:hover{transform:translateY(-1px)}
.quick-icon{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13.6px;flex:none}
.quick-item b{display:block;font-weight:400;font-size:12px;color:var(--ink)}
.quick-item small{display:block;font-size:10px;color:var(--muted)}
.quick-item .fa-chevron-right{margin-left:auto;color:var(--muted);font-size:12px}

.card{background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden;min-width:0;margin-bottom:16px}
.card-header{background:linear-gradient(#FBFCFE,#F3F6FB);border-bottom:1px solid #E5E7EB;padding:9px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13.5px;font-weight:600;color:var(--navy);min-height:44px}
.card-header .fa-solid,.card-header .fa-regular{color:var(--muted)}
.card-header .right{margin-left:auto;display:flex;gap:6px;align-items:center;font-weight:400}
.card-body{padding:14px 16px}
.hint{color:var(--muted);font-size:12px;margin:0 0 10px}
.grp{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin:14px 0 6px}
.grp:first-child{margin-top:0}
.cols{display:grid;grid-template-columns:340px 1fr;gap:16px;align-items:start}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.cols>div,.cols2>div{min-width:0}
@media (max-width:1100px){.cols,.cols2{grid-template-columns:minmax(0,1fr)}}
.crow{display:flex;align-items:center;gap:10px;padding:7px 9px;border:1px solid var(--cell);border-radius:8px;margin-bottom:5px;cursor:pointer;background:#fff}
.crow:hover{background:var(--cellbg)}
.crow.sel{background:var(--cellbg);border-color:#b6d4fe}
.crow.dis{opacity:.55;cursor:not-allowed;background:var(--th)}
.crow input{accent-color:var(--primary);width:15px;height:15px;flex:none}
.crow .nm{flex:1;min-width:0}
.crow .nm b{font-weight:600;font-size:12px}
.crow .nm div{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ects{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.low{background:var(--success)}.dot.mid{background:var(--info)}.dot.crit{background:#f59e0b}.dot.full{background:var(--danger)}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:6px;white-space:nowrap}
.badge.low{background:#d1e7dd;color:#0f5132}.badge.mid{background:#cff4fc;color:#055160}
.badge.crit{background:#fff3cd;color:#664d03}.badge.full{background:#f8d7da;color:#842029}
.badge.acc{background:#cfe2ff;color:#084298}.badge.mut{background:#e9ecef;color:#495057}
.load{margin:12px 0;padding:10px 12px;border-radius:10px;background:var(--th);border:1px solid var(--cell)}
.bar{height:8px;border-radius:99px;background:#e9ecef;overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.sw{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12.5px;padding:5px 0;cursor:pointer}
.sw input{appearance:none;width:32px;height:18px;border-radius:99px;background:#fff;border:1px solid #ced4da;position:relative;cursor:pointer;flex:none;transition:.15s}
.sw input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#adb5bd;transition:.15s}
.sw input:checked{background:var(--primary);border-color:var(--primary)}.sw input:checked::after{left:16px;background:#fff}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--primary);background:var(--primary);color:#fff;border-radius:7px;padding:6px 12px;cursor:pointer;font-size:12px;white-space:nowrap}
.btn:hover{filter:brightness(.95)}
.btn.outline{background:#fff;color:var(--primary)}
.btn.osec{background:#fff;color:#6c757d;border-color:#6c757d}
.btn.osuc{background:#fff;color:var(--success);border-color:var(--success)}
.btn.osuc:hover{background:var(--success);color:#fff}
.btn.sm{padding:3px 9px;font-size:11.5px}
.btn-group{display:inline-flex}.btn-group .btn{border-radius:0}.btn-group .btn:first-child{border-radius:7px 0 0 7px}.btn-group .btn:last-child{border-radius:0 7px 7px 0}
.btn-group .btn+.btn{margin-left:-1px}
.metrics{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.metric{background:var(--th);border:1px solid var(--cell);border-radius:8px;padding:4px 10px;font-size:11.5px;color:var(--muted)}
.metric b{color:var(--ink);font-size:13px;margin-right:3px}

/* ders programı tablosu (pivot) */
.ttw{overflow-x:auto;border:1px solid #CFD6DF;border-radius:12px;background:#F9FAFB;padding:8px}
.tt{display:grid;grid-template-columns:78px repeat(5,minmax(112px,1fr));grid-template-rows:38px repeat(9,56px);gap:4px;min-width:660px}
.pv-h{background:var(--th);border:1px solid var(--cell);border-radius:8px;color:#374151;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.pv-h i{font-size:11px;color:#6B7280;font-weight:300}
.pv-t{background:var(--th);border:1px solid var(--cell);border-radius:8px;color:#374151;font-size:11.5px;display:flex;align-items:center;justify-content:center;gap:5px}
.pv-t i{color:#6B7280;font-size:10px}
.pv-c{background:#fff;border:1px solid var(--cell);border-radius:8px}
.blk{z-index:1;background:var(--cellbg);border:1px solid #cfe2f3;border-left:3px solid hsl(var(--h) 65% 48%);border-radius:8px;padding:5px 8px;overflow:hidden;font-size:11.5px;line-height:1.3;color:var(--text2);position:relative}
.blk .cd{color:var(--text2);font-weight:600}.blk .cd i{color:#6B7280;font-size:10.5px;margin-right:4px}
.blk .cn{text-transform:uppercase;font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .cr{color:#6B7280;font-size:10.5px}
.blk .rk{position:absolute;top:4px;right:5px;font-size:9.5px;font-weight:700;padding:0 5px;border-radius:4px}
.rk.full{background:#f8d7da;color:#842029}.rk.crit{background:#fff3cd;color:#664d03}

/* grid tabloları */
.tblw{overflow-x:auto}
table.grid{width:100%;border-collapse:separate;border-spacing:0 4px;font-size:12px;color:var(--text2)}
table.grid th{background:var(--th);color:#374151;font-weight:600;font-size:11.5px;text-align:left;padding:8px 10px;border-top:1px solid var(--cell);border-bottom:1px solid var(--cell);white-space:nowrap}
table.grid td{background:#fff;padding:8px 10px;border-top:1px solid var(--cell);border-bottom:1px solid var(--cell);vertical-align:middle}
table.grid tr>*:first-child{border-left:1px solid var(--cell);border-radius:8px 0 0 8px}
table.grid tr>*:last-child{border-right:1px solid var(--cell);border-radius:0 8px 8px 0}
table.grid tr.mine td{background:var(--cellbg)}
table.grid b{color:var(--ink)}
.fill{display:flex;align-items:center;gap:8px;min-width:130px}
.fill .bar{flex:1}
.fill span{font-size:11.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.bell{border:1px solid #ced4da;background:#fff;border-radius:7px;width:30px;height:28px;cursor:pointer;color:#6c757d}
.bell.on{background:#cfe2ff;border-color:var(--primary);color:var(--primary)}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.inp{border:1px solid #ced4da;background:#fff;border-radius:6px;padding:5px 9px;font-size:12px}
.inp:focus{outline:2px solid #b6d4fe;border-color:#86b7fe}
.qcard{border:1px solid var(--cell);border-radius:10px;padding:12px;margin-bottom:8px;background:#fff}
.qcard.crit{border-color:#ffda6a;background:#fffdf5}.qcard.full{border-color:#f1aeb5;background:#fff8f8}
.qhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.qhead .t{flex:1;min-width:170px}
.qhead .t b{font-size:12.5px}.qhead .t div{font-size:11.5px;color:var(--muted)}
.alts{margin-top:10px;padding-top:8px;border-top:1px dashed var(--cell)}
.alt{display:flex;align-items:center;gap:10px;padding:5px 0;flex-wrap:wrap}
.alt .t{flex:1;min-width:180px;font-size:12px}
.alt .t div{color:var(--muted);font-size:11.5px}
.small{font-size:11.5px;color:var(--muted)}
.curr{display:grid;grid-template-columns:repeat(8,minmax(128px,1fr));gap:8px;overflow-x:auto;padding-bottom:4px}
.sem h4{margin:0 0 6px;font-size:11.5px;color:#374151;font-weight:600;background:var(--th);border:1px solid var(--cell);border-radius:8px;padding:5px 8px;text-align:center}
.cc{border:1px solid var(--cell);border-left-width:3px;border-radius:8px;padding:6px 8px;margin-bottom:5px;font-size:11px;cursor:pointer;background:#fff;transition:opacity .15s;color:var(--text2)}
.cc b{font-size:11.5px;display:flex;justify-content:space-between;gap:4px;color:var(--ink)}
.cc div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase;font-size:10px}
.cc.ok{border-left-color:var(--success)}.cc.cond{border-left-color:#f59e0b}.cc.fail{border-left-color:var(--danger);background:#fff5f5}
.cc.plan{border-left-color:var(--primary);background:var(--cellbg)}.cc.todo{border-left-color:#ced4da}
.cc.locked{border-left-color:#ced4da;background:var(--th);border-style:dashed;border-left-style:solid}
.curr.chain .cc{opacity:.3}.curr.chain .cc.hl{opacity:1;box-shadow:0 0 0 2px #86b7fe}.curr.chain .cc.hl0{opacity:1;box-shadow:0 0 0 2px var(--navy)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:0 0 10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.terms{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.term{border:1px solid var(--cell);border-radius:10px;overflow:hidden}
.term h4{margin:0;font-size:12px;display:flex;justify-content:space-between;align-items:center;background:var(--th);border-bottom:1px solid var(--cell);padding:7px 10px;color:#374151}
.term ul{list-style:none;margin:0;padding:6px 10px}
.term li{font-size:11.5px;padding:3px 0;display:flex;justify-content:space-between;gap:8px;color:var(--text2)}
.term li em{color:var(--muted);font-style:normal}
.warns{display:grid;gap:8px}
.warn{display:flex;gap:10px;align-items:flex-start;font-size:12px;padding:9px 12px;border-radius:8px;border:1px solid}
.warn i{margin-top:2px}
.warn.bad{background:#f8d7da;border-color:#f1aeb5;color:#58151c}.warn.w{background:#fff3cd;border-color:#ffe69c;color:#664d03}.warn.ok{background:#d1e7dd;border-color:#a3cfbb;color:#0a3622}
.catrow{margin-bottom:12px}
.catrow .lb{display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px}
.gs{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;font-size:12px}
.big{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#fff;margin-right:2px;animation:pl 1s infinite}
@keyframes pl{50%{opacity:.25}}
#toasts{position:fixed;right:16px;bottom:46px;display:grid;gap:8px;z-index:60;max-width:calc(100vw - 32px)}
.toast{background:var(--navy);color:#fff;padding:10px 14px;border-radius:10px;font-size:12.5px;box-shadow:0 6px 20px rgba(0,0,0,.2);border-left:3px solid var(--gold);animation:tin .2s}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
.empty{padding:28px;text-align:center;color:var(--muted)}
.diag li{margin:6px 0;font-size:12.5px}
.ptitle{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:16px;font-weight:400;color:var(--navy)}
.ptitle i{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-size:13px}
.ptitle small{font-size:11.5px;color:var(--muted);margin-left:4px}
.demo{font-size:11px;color:var(--muted)}
.rtw{max-height:520px;overflow:auto}
.rtw thead th{position:sticky;top:0;z-index:1}
table.grid tr.me td{background:#fdf4ff;border-color:#e9a8f5}
table.grid tr.me td:first-child{box-shadow:inset 3px 0 0 #a21caf}
.hist{display:flex;align-items:flex-end;gap:4px;height:180px;padding:18px 0 22px}
.hb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;position:relative}
.hb i{display:block;width:100%;background:#c4b5fd;border-radius:5px 5px 0 0;min-height:2px}
.hb.me i{background:#a21caf}
.hv{font-size:10px;color:var(--muted);margin-bottom:2px}
.hl{position:absolute;bottom:-18px;font-size:9.5px;color:var(--muted);white-space:nowrap}
</style>
</head>

function metrics(plan){const days=[[],[],[],[],[]];let full=0,crit=0;
 for(const[c,i]of Object.entries(plan)){const r=risk(c,i);if(r==='full')full++;else if(r==='crit')crit++;
  for(const[d,st,l]of OFFER[c][i].slots)for(let h=st;h<st+l;h++)days[d].push(h)}
 let gaps=0,free=0,early=0,late=0,hours=0;
 days.forEach(a=>{if(!a.length){free++;return}const mn=Math.min(...a),mx=Math.max(...a);gaps+=(mx-mn+1)-a.length;if(mn===H0)early++;late=Math.max(late,mx+1);hours+=a.length});

function scoreOf(m){let s=82;s-=m.gaps*(S.prefs.minGaps?5:2);if(S.prefs.noEarly)s-=m.early*6;if(S.prefs.freeFri&&m.fri)s-=16;
 s+=m.free*6;s-=m.full*30;s-=m.crit*(S.prefs.avoidFull?7:2);return Math.max(0,Math.min(100,Math.round(s)))}
function solve(codes,avoidFull){
 const opts=codes.map(c=>{let idx=OFFER[c].map((_,i)=>i);if(avoidFull){const nf=idx.filter(i=>risk(c,i)!=='full');if(nf.length)idx=nf}return idx});
 const out=[],cur=[];
 (function bt(k){if(out.length>4000)return;if(k===codes.length){out.push(cur.slice(0,k));return}
  for(const i of opts[k]){const sl=OFFER[codes[k]][i].slots;let ok=true;
   for(let j=0;j<k;j++)if(clash(sl,OFFER[codes[j]][cur[j]].slots)){ok=false;break}
   if(ok){cur[k]=i;bt(k+1)}}})(0);
 return{out,opts}}
function generate(){

 const{out,opts}=solve(codes,S.prefs.avoidFull);
 S.results=out.map(arr=>{const plan={};codes.forEach((c,k)=>plan[c]=arr[k]);const m=metrics(plan);return{plan,m,score:scoreOf(m)}})
  .sort((a,b)=>b.score-a.score||a.m.gaps-b.m.gaps).slice(0,6);
 if(!S.results.length){
  const pairs=[];for(let a=0;a<codes.length;a++)for(let b=a+1;b<codes.length;b++){
   if(opts[a].every(i=>opts[b].every(j=>clash(OFFER[codes[a]][i].slots,OFFER[codes[b]][j].slots))))pairs.push([codes[a],codes[b]])}
  const drops=codes.map(c=>({c,n:solve(codes.filter(x=>x!==c),S.prefs.avoidFull).out.length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  S.diag={pairs,drops}}}

 let R,right='';

 else if(!S.results.length){R=`<div class="warn bad" style="margin-bottom:10px"><i class="fa-solid fa-circle-xmark"></i><div><b>Çakışmasız program bulunamadı.</b> Seçtiğin derslerin hiçbir şube kombinasyonu birlikte sığmıyor.</div></div><ul class="diag">`;
  S.diag.pairs.forEach(([a,b])=>R+=`<li><b>${a}</b> ve <b>${b}</b>: tüm şubeleri birbiriyle çakışıyor.</li>`);
  S.diag.drops.slice(0,3).forEach(d=>R+=`<li><b>${d.c}</b> dersini çıkarırsan ${d.n} uygun program oluşuyor. <button class="btn sm osec" data-act="drop" data-c="${d.c}">Çıkar</button></li>`);

 else{const r=S.results[S.ri],active=samePlan(r.plan,S.plan);

/* ---------- KONTENJAN ---------- */
function alts(code){const cur=S.plan[code],others=Object.entries(S.plan).filter(([c])=>c!==code);
 const fits=(c,i)=>others.every(([oc,oi])=>!clash(OFFER[c][i].slots,OFFER[oc][oi].slots));
 const free=(c,i)=>1-OFFER[c][i].enr/OFFER[c][i].cap;
 const same=OFFER[code].map((_,i)=>i).filter(i=>i!==cur&&risk(code,i)!=='full'&&fits(code,i)).map(i=>({c:code,i}));
 const subs=[];if(C[code].cat!=='Z')for(const c of Object.keys(OFFER)){
  if(c===code||S.plan[c]!==undefined||C[c].cat!==C[code].cat||!elig(c).ok)continue;
  OFFER[c].forEach((_,i)=>{if(risk(c,i)!=='full'&&fits(c,i))subs.push({c,i})})}
 const srt=(a,b)=>RO[risk(a.c,a.i)]-RO[risk(b.c,b.i)]||free(b.c,b.i)-free(a.c,a.i);
 return{same:same.sort(srt),subs:subs.sort(srt).slice(0,3)}}
function altRow(from,a){const s=OFFER[a.c][a.i];
 return`<div class="alt"><div class="t"><b>${a.c} · Şube ${a.i+1}</b>${a.c!==from?' — '+C[a.c].name:''}<div>${timeStr(s)} · ${s.instr} · ${s.cap-s.enr} boş yer</div></div>
  ${badge(risk(a.c,a.i))}<button class="btn sm osuc" data-act="apply" data-from="${from}" data-c="${a.c}" data-i="${a.i}"><i class="fa-solid fa-arrow-right-arrow-left"></i>Uygula</button></div>`}
function renderQuota(){
 const plan=S.plan||{},entries=Object.entries(plan);
 const atRisk=entries.filter(([c,i])=>['full','crit'].includes(risk(c,i)));
 let A=`<p class="hint">Tahmin: mevcut kayıt + günlük talep × kalan ${DAYS_LEFT} gün.</p>`;
 if(!entries.length)A+='<div class="empty">Henüz aktif programın yok. Planlayıcıdan bir program seç.</div>';
 else{A+=atRisk.length?`<div class="warn w" style="margin-bottom:10px"><i class="fa-solid fa-triangle-exclamation"></i><div><b>${atRisk.length} şube</b> risk altında. Aşağıda programına uyan alternatifler listelendi.</div></div>`
   :`<div class="warn ok" style="margin-bottom:10px"><i class="fa-solid fa-circle-check"></i><div>Programındaki tüm şubelerde yer var ve kapanma riski düşük.</div></div>`;
  entries.forEach(([c,i])=>{const s=OFFER[c][i],k=risk(c,i),id=c+':'+i;
   A+=`<div class="qcard ${k}"><div class="qhead"><div class="t"><b>${c} · Şube ${i+1}</b> — ${C[c].name}<div>${timeStr(s)} · ${s.instr}</div></div>
    <div style="min-width:140px">${fillBar(s)}<div class="small" style="margin-top:2px">Tahmini talep: ${proj(s)}</div></div>
    ${badge(k)}<button class="bell${S.watch.has(id)?' on':''}" data-act="watch" data-id="${id}" title="Takip et"><i class="fa-${S.watch.has(id)?'solid':'regular'} fa-bell"></i></button></div>`;
   if(k==='full'||k==='crit'){const al=alts(c);A+='<div class="alts">';
    if(al.same.length)A+=`<div class="small">Aynı dersin programına uyan diğer şubeleri:</div>`+al.same.map(a=>altRow(c,a)).join('');
    if(al.subs.length)A+=`<div class="small" style="margin-top:6px">Yerine alabileceğin ${CAT[C[c].cat].toLowerCase()} dersler:</div>`+al.subs.map(a=>altRow(c,a)).join('');
    if(!al.same.length&&!al.subs.length)A+=`<div class="small">Programına uyan alternatif yok. ${k==='full'?'Şubeyi takip et; yer açılınca bildirim alırsın.':'Kaydını kontenjan dolmadan tamamla.'}</div>`;
    A+='</div>'}
   A+='</div>'})}
 const simBtn=`<button class="btn sm ${S.sim?'':'outline'}" data-act="sim">${S.sim?'<span class="live"></span>Canlı izleme açık':'<i class="fa-solid fa-play"></i>Canlı izlemeyi başlat'}</button>`;
 const B=`<p class="hint"><i class="fa-regular fa-bell"></i> ile takip ettiğin dolu şubede yer açıldığında bildirim alırsın (canlı izleme açıkken).</p>
  <div class="toolbar"><input class="inp" id="qq" placeholder="Ders kodu veya adı ara" value="${S.qq}" style="flex:1;min-width:160px">
  <select class="inp" data-act="qf"><option value="all"${S.qf==='all'?' selected':''}>Tüm şubeler</option><option value="plan"${S.qf==='plan'?' selected':''}>Alabileceğim dersler</option>
  <option value="risk"${S.qf==='risk'?' selected':''}>Sadece dolu / kritik</option><option value="watch"${S.qf==='watch'?' selected':''}>Takip ettiklerim</option></select></div>
  <div class="tblw" id="qtable">${quotaTable()}</div>`;
 return pageTitle()+`<div class="cols2"><div>${card('Aktif Programımın Kontenjan Durumu','fa-user-check',A,simBtn)}</div><div>${card('Açılan Bölüm Dersleri — Şube Kontenjanları','fa-table-list',B)}</div></div>`}
function quotaTable(){const q=S.qq.toLocaleLowerCase('tr');let rows='';
 for(const[c,secs]of Object.entries(OFFER))secs.forEach((s,i)=>{const id=c+':'+i,k=risk(c,i);
  if(q&&!(c.toLowerCase().includes(q)||C[c].name.toLocaleLowerCase('tr').includes(q)))return;
  if(S.qf==='plan'&&!elig(c).ok)return;if(S.qf==='risk'&&!['full','crit'].includes(k))return;if(S.qf==='watch'&&!S.watch.has(id))return;
  const mine=S.plan&&S.plan[c]===i;
  rows+=`<tr class="${mine?'mine':''}"><td><b>${c}(${i+1})</b>${mine?' <span class="badge acc">Programımda</span>':''}<div class="small" style="text-transform:uppercase">${C[c].name}</div></td>
   <td style="min-width:160px">${timeStr(s)}</td><td>${fillBar(s)}</td><td style="font-variant-numeric:tabular-nums">${proj(s)}</td><td>${badge(k)}</td>
   <td><button class="bell${S.watch.has(id)?' on':''}" data-act="watch" data-id="${id}" title="Takip et"><i class="fa-${S.watch.has(id)?'solid':'regular'} fa-bell"></i></button></td></tr>`});
 return`<table class="grid"><tr><th>Ders(Şube)</th><th>Saat</th><th>Doluluk</th><th>Tahmin</th><th>Durum</th><th></th></tr>${rows||'<tr><td colspan="6" class="empty">Kayıt bulunamadı</td></tr>'}</table>`}

/* ---------- MEZUNİYET ---------- */
function gpa(g){let p=0,e=0;for(const[c,gr]of Object.entries(g)){if(!(gr in GP))continue;p+=GP[gr]*C[c].ects;e+=C[c].ects}return{v:e?p/e:0,p,e}}
function catE(set,cat){return[...set].filter(c=>C[c].cat===cat).reduce((a,c)=>a+C[c].ects,0)}
function future(){
 const planned=Object.keys(S.plan||{});
 const done=new Set(Object.keys(G).filter(passed).concat(planned));
 let doneE=ectsOf([...done]),asE=catE(done,'AS'),ssE=catE(done,'SS');
 const remZ=Object.values(C).filter(x=>x.cat==='Z'&&!done.has(x.code)).sort((a,b)=>a.sem-b.sem).map(x=>x.code);
 const used=new Set([...done,...Object.keys(G)]);const terms=[];let ay=2026,season='Bahar';
 for(let t=0;t<8&&(remZ.length||asE<REQ.AS||ssE<REQ.SS);t++){
  const prev=new Set(done),prevE=doneE,list=[];let load=0;
  for(const c of remZ.slice()){const x=C[c];if((x.sem%2===1)!==(season==='Güz'))continue;
   if(!x.pre.every(p=>prev.has(p))||prevE<x.minE||load+x.ects>36)continue;list.push(c);load+=x.ects;remZ.splice(remZ.indexOf(c),1)}
  const pool=cat=>Object.values(C).filter(x=>x.cat===cat&&!used.has(x.code)&&x.pre.every(p=>prev.has(p)));
  while(asE<REQ.AS&&load+6<=32){const p=pool('AS')[0];if(p){list.push(p.code);used.add(p.code)}else list.push({ph:'Alan Seçmeli',ects:6});asE+=6;load+=6}
  while(ssE<REQ.SS&&load+4<=32){const p=pool('SS')[0];if(p){list.push(p.code);used.add(p.code);ssE+=p.ects;load+=p.ects}else{list.push({ph:'Serbest Seçmeli',ects:5});ssE+=5;load+=5}}
  list.forEach(c=>{if(typeof c==='string')done.add(c)});doneE+=load;
  terms.push({name:`${ay}-${ay+1} ${season}`,list,load,season,ay});
  if(season==='Bahar'){season='Güz';ay++}else season='Bahar'}
 const last=terms[terms.length-1];
 const grad=last?(last.season==='Bahar'?`Haziran ${last.ay+1}`:`Ocak ${last.ay+1}`):'Ocak 2027';
 return{terms,grad,stuck:remZ}}
function anc(c,acc=new Set()){C[c].pre.forEach(p=>{if(!acc.has(p)){acc.add(p);anc(p,acc)}});return acc}
function desc(c,acc=new Set()){Object.values(C).forEach(x=>{if(x.pre.includes(c)&&!acc.has(x.code)){acc.add(x.code);desc(x.code,acc)}});return acc}
function renderRoad(){
 const plan=S.plan||{},pc=Object.keys(plan);
 const pass=Object.keys(G).filter(passed),passE=ectsOf(pass),planE=ectsOf(pc.filter(c=>!passed(c)));
 const cur=gpa(G),fut=future();
 pc.forEach(c=>{if(!S.exp[c])S.exp[c]='BB'});
 const exp={};pc.forEach(c=>exp[c]=S.exp[c]);const after=gpa(grades(exp)),term=gpa(exp);
 const chain=S.chain?{a:anc(S.chain),d:desc(S.chain)}:null;
 const kc=(l1,l2,icon,title,big,sub)=>`<div class="info-card" style="--l1:${l1};--l2:${l2}"><span class="icon-wrap"><i class="fa-solid ${icon}"></i></span><div><span class="ic-title">${title}</span><div class="ic-big">${big}</div><span class="ic-line">${sub}</span></div></div>`;
 let h=pageTitle()+`<div class="icards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
  ${kc('#C7D2FE','#FCE7F3','fa-chart-line','Genel Not Ortalaması',fmt(cur.v),cur.v>=3.5?'Yüksek Onur':cur.v>=3?'Onur':cur.v>=2?'Başarılı':'Sınamalı')}
  ${kc('#D1FAE5','#BFDBFE','fa-layer-group','Tamamlanan AKTS',`${passE} <span style="font-size:13px;font-weight:400">/ ${TOTAL}</span>`,`%${Math.round(passE/TOTAL*100)} tamamlandı`)}
  ${kc('#BFDBFE','#BBF7D0','fa-book-open','Bu Dönem Planlanan',planE+' AKTS',`${pc.length} ders`)}
  ${kc('#FDE68A','#FCE7F3','fa-user-graduate','Tahmini Mezuniyet',fut.grad,`${fut.terms.length+1} dönem kaldı`)}</div>`;
 const seg=(v,col)=>`<i style="width:${v/TOTAL*100}%;background:${col}"></i>`;
 const doneSet=new Set(pass),planSet=new Set(pc);
 const prog=`<p class="hint">Toplam ${TOTAL} AKTS: zorunlu ${REQ.Z}, alan seçmeli ${REQ.AS}, serbest seçmeli ${REQ.SS}.</p>
  <div class="bar" style="height:12px;margin-bottom:6px">${seg(passE,'var(--success)')}${seg(planE,'var(--primary)')}</div>
  <div class="legend"><span><i style="background:var(--success)"></i>Tamamlandı ${passE}</span><span><i style="background:var(--primary)"></i>Bu dönem ${planE}</span><span><i style="background:#e9ecef"></i>Kalan ${Math.max(0,TOTAL-passE-planE)}</span></div>
  ${['Z','AS','SS'].map(k=>{const d=catE(doneSet,k),p=catE(new Set(pc.filter(c=>!passed(c))),k),r=REQ[k],dw=Math.min(100,d/r*100);
   return`<div class="catrow"><div class="lb"><span>${CAT[k]}</span><span class="small">${d}${p?' + '+p:''} / ${r} AKTS</span></div>
   <div class="bar"><i style="width:${dw}%;background:var(--success)"></i><i style="width:${Math.min(100-dw,p/r*100)}%;background:var(--primary)"></i></div></div>`}).join('')}`;
 h+=`<div class="cols2"><div>${card('Mezuniyet İlerleme Durumu','fa-bars-progress',prog)}</div><div>${card('Dikkat Edilmesi Gerekenler','fa-triangle-exclamation',`<div class="warns">${warnings(plan,passE).join('')}</div>`)}</div></div>`;
 let cu=`<p class="hint">Bir derse tıkla: ön koşul zinciri ve kilidini açtığı dersler vurgulanır.</p>
  <div class="legend"><span><i style="background:var(--success)"></i>Geçti</span><span><i style="background:#f59e0b"></i>Koşullu (DD/DC)</span><span><i style="background:var(--danger)"></i>Kaldı</span><span><i style="background:var(--primary)"></i>Bu dönem</span><span><i style="background:#ced4da"></i>Kalan</span><span>🔒 Ön koşul eksik</span></div>
  <div class="curr${chain?' chain':''}">`;
 for(let s=1;s<=8;s++){cu+=`<div class="sem"><h4>${s}. Yarıyıl</h4>`;
  Object.values(C).filter(x=>x.cat==='Z'&&x.sem===s).forEach(x=>{const g=G[x.code];let st,tag='';
   if(planSet.has(x.code)){st='plan';tag=g==='FF'?'Tekrar':'Bu dönem'}else if(g==='FF'){st='fail';tag='FF'}
   else if(g){st=['DD','DC'].includes(g)?'cond':'ok';tag=g}else{const miss=x.pre.filter(p=>!passed(p)&&!planSet.has(p));st=miss.length||x.minE>passE+planE?'locked':'todo';tag=st==='locked'?'🔒':''}
   const hl=chain?(x.code===S.chain?' hl0':(chain.a.has(x.code)||chain.d.has(x.code))?' hl':''):'';
   cu+=`<div class="cc ${st}${hl}" data-act="chain" data-c="${x.code}" title="${x.pre.length?'Ön koşul: '+x.pre.join(', '):'Ön koşul yok'}${x.minE?' · En az '+x.minE+' AKTS':''}"><b>${x.code}<span>${tag}</span></b><div>${x.name}</div></div>`});
  cu+='</div>'}
 cu+='</div>';
 h+=card('Müfredat Durum','fa-sitemap',cu,S.chain?'<button class="btn sm osec" data-act="chain" data-c="">Vurguyu kaldır</button>':'');
 const tp=`<p class="hint">Ön koşullar, dönem açılışları (Güz/Bahar) ve AKTS gereksinimlerine göre otomatik oluşturuldu.</p><div class="terms">
  <div class="term" style="border-color:#86b7fe"><h4>2026-2027 Güz <span class="badge acc">Şimdi</span></h4><ul>${pc.map(c=>`<li><span>${c} ${C[c].name}</span><em>${C[c].ects}</em></li>`).join('')||'<li class="small">Plan yok</li>'}</ul></div>
  ${fut.terms.map(t=>`<div class="term"><h4>${t.name}<span class="small" style="font-weight:400">${t.load} AKTS</span></h4><ul>${t.list.map(x=>typeof x==='string'
   ?`<li><span>${x} ${C[x].name}${C[x].cat!=='Z'?` <span class="badge mut">${C[x].cat}</span>`:''}</span><em>${C[x].ects}</em></li>`
   :`<li><span class="small">${x.ph}</span><em>${x.ects}</em></li>`).join('')}</ul></div>`).join('')}</div>
  ${fut.stuck.length?`<div class="warn bad" style="margin-top:10px"><i class="fa-solid fa-circle-xmark"></i><div>Planlanamayan dersler: ${fut.stuck.join(', ')}</div></div>`:''}`;
 const gs=`<p class="hint">Bu dönem beklediğin harf notlarını seç.</p><div class="gs">
  ${pc.map(c=>`<span><b>${c}</b> <span class="small">${C[c].name}${G[c]==='FF'?' (FF yerine)':''}</span></span><select class="inp" data-act="exp" data-c="${c}">${Object.keys(GP).map(g=>`<option${S.exp[c]===g?' selected':''}>${g}</option>`).join('')}</select>`).join('')}
  </div><div style="display:flex;gap:24px;margin:16px 0;flex-wrap:wrap"><div><div class="small">Dönem ortalaması</div><div class="big">${fmt(term.v)}</div></div>
  <div><div class="small">Yeni AGNO</div><div class="big" style="color:${after.v>=cur.v?'var(--success)':'var(--danger)'}">${fmt(after.v)} <span style="font-size:12px">${after.v>=cur.v?'▲':'▼'} ${fmt(Math.abs(after.v-cur.v))}</span></div></div>
  <div><div class="small">Tahmini bölüm sırası (4. sınıf)</div><div class="big">${rankInfo('4',after.v).rank} <span style="font-size:12px;font-weight:400">(şu an ${rankInfo('4',cur.v).rank})</span></div></div></div>
  <div class="grp">Hedef AGNO</div><div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><input class="inp" type="number" step="0.05" min="1" max="4" id="target" value="${S.target}" style="width:80px">
  <span id="tout" style="font-size:12px">${targetMsg(after)}</span></div>`;
 h+=`<div class="cols2"><div>${card('Kalan Dönemler İçin Önerilen Plan','fa-route',tp)}</div><div>${card('Transkript Senaryosu — Not Simülatörü','fa-calculator',gs)}</div></div>`;
 return h}
function targetMsg(after){const rem=Math.max(0,TOTAL-after.e),need=(S.target*(after.e+rem)-after.p)/(rem||1);
 if(!rem)return'Kalan ders yok.';if(need>4)return`Kalan ${rem} AKTS'de tümü AA olsa bile <b>${fmt(S.target)}</b> hedefine ulaşılamıyor.`;
 if(need<=0)return`Bu hedef zaten garanti görünüyor.`;return`Kalan <b>${rem} AKTS</b>'de en az <b>${fmt(need)}</b> ortalama gerekli.`}
function warnings(plan,passE){const w=[],pc=new Set(Object.keys(plan));
 const W=(cls,ic,html)=>`<div class="warn ${cls}"><i class="fa-solid ${ic}"></i><div>${html}</div></div>`;
 Object.entries(G).forEach(([c,g])=>{if(g==='FF')w.push(pc.has(c)?W('ok','fa-circle-check',`<b>${c}</b> (FF) bu dönem tekrar planlandı. Geçince FF notunun yerine geçer.`)
  :W('bad','fa-circle-xmark',`<b>${c} ${C[c].name}</b> FF ile kaldı. ${OFFER[c]?'Bu dönem açık; programına eklemen önerilir.':(C[c].sem%2?'Güz':'Bahar')+' döneminde tekrar alınmalı.'}`));
  if(g==='DD'||g==='DC')w.push(W('w','fa-triangle-exclamation',`<b>${c}</b> ${g} ile koşullu geçildi. AGNO 2,00'ın altına düşerse tekrar alman gerekebilir.`))});
 const blockers={};Object.values(C).forEach(x=>{if(passed(x.code)||pc.has(x.code))return;x.pre.forEach(p=>{if(!passed(p)&&!pc.has(p))(blockers[p]=blockers[p]||[]).push(x.code)})});
 Object.entries(blockers).forEach(([p,l])=>{if(C[p].cat==='Z'&&C[p].sem<=5)w.push(W('w','fa-lock',`<b>${p}</b> ${OFFER[p]?'bu dönem programında yok':'henüz geçilmedi'}; ${l.join(', ')} ${l.length>1?'derslerini':'dersini'} kilitliyor.`))});
 const pe=passE+ectsOf([...pc].filter(c=>!passed(c)));
 w.push(pe>=150?W('ok','fa-circle-check',`Bu dönem sonunda <b>${pe} AKTS</b> ile Bitirme Projesi I şartını (150 AKTS) sağlıyorsun.`)
  :W('w','fa-triangle-exclamation',`Bitirme Projesi I için 150 AKTS gerekli; bu dönem sonunda ${pe} AKTS olacak.`));
 return w}

/* ---------- MENÜ RENDER ---------- */
function renderMenu(){const q=S.ms.toLocaleLowerCase('tr').trim();const m=x=>!q||x.toLocaleLowerCase('tr').includes(q);let h='';
 MENU.forEach(sec=>{let body='';
  if(sec.items)sec.items.forEach(([tab,t,ic])=>{if(m(t))body+=`<a class="nav-link${S.tab===tab?' active':''}" data-tab="${tab}"><i class="ic fa-solid ${ic}"></i>${t}${tab!=='home'?'<span class="new">YENİ</span>':''}</a>`});
  if(sec.groups)sec.groups.forEach(([g,ic,subs])=>{const vis=subs.filter(m);if(!vis.length&&!m(g))return;const open=q||S.open.has(g);
   body+=`<a class="nav-link${open?' open':''}" data-act="grp" data-g="${g}"><i class="ic fa-solid ${ic}"></i>${g}<i class="chev fa-solid fa-chevron-right"></i></a>`;
   if(open)body+=`<div class="subnav">${(q?vis:subs).map(s=>`<a class="nav-link" data-act="stub" data-t="${s}">${s}</a>`).join('')}</div>`});
  if(body)h+=`<div class="nav-header">${sec.h}</div>${body}`});
 $('#menu').innerHTML=h||'<div class="nav-header">Sonuç yok</div>'}

/* ---------- ANA RENDER ---------- */
function render(){renderMenu();
 $('#app').innerHTML=S.tab==='plan'?renderPlan():S.tab==='quota'?renderQuota():S.tab==='road'?renderRoad():S.tab==='rank'?renderRank():pageTitle()+renderHome();save();
 if(S.tab==='rank'){const w=$('#rtw'),me=$('#rtw tr.me');if(w&&me)w.scrollTop=me.offsetTop-w.clientHeight/2}}

/* ---------- BÖLÜM SIRALAMASI ---------- */
function rng(seed){return()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
/* Bölüm 117 kişi (siz dahil): tüm bölümde 43., 4. sınıfta (40 kişi) 15. sıra */
const COHORT=(()=>{const r=rng(2107),L='ABCDEFGHİKMNOSŞTUYZ',out=[],sizes={1:26,2:26,3:25,4:39},above={1:10,2:9,3:9,4:14};
 for(const s of [1,2,3,4])for(let k=0;k<sizes[s];k++){const u=r();
  const gpa=k<above[s]?Math.round((2.31+Math.pow(u,1.4)*1.64)*100)/100:Math.round((2.29-Math.pow(u,1.2)*.72)*100)/100;
  const akts=Math.round(Math.min(240,(s*60-30)*(.78+r()*.3)));const yy=26-s-(r()<.35?1:0);
  out.push({no:`${yy}070${String(Math.floor(r()*1000)).padStart(3,'0')}${String(Math.floor(r()*1000)).padStart(3,'0')}`,
   name:`${L[Math.floor(r()*L.length)]}***** ${L[Math.floor(r()*L.length)]}*****`,gpa,akts,s})}
 return out})();
function cohortList(f,gpa){const me={no:'21070008008',name:'ÖRNEK ÖĞRENCİ',gpa:Math.round(gpa*100)/100,akts:PASSE,s:4,me:true};
 return COHORT.filter(x=>f==='all'||x.s===+f).concat(me).sort((a,b)=>b.gpa-a.gpa||b.akts-a.akts||(a.me?-1:b.me?1:0))}
function rankInfo(f,gpa){const l=cohortList(f,gpa),i=l.findIndex(x=>x.me);return{rank:i+1,n:l.length,list:l,pct:Math.ceil((i+1)/l.length*100)}}
const maskNo=n=>n.slice(0,4)+'****'+n.slice(-3);
function renderRank(){
 const cur=gpa(G),R=rankInfo(S.rf,cur.v),l=R.list,avg=l.reduce((a,x)=>a+x.gpa,0)/l.length;
 const thr=p=>l[Math.max(0,Math.ceil(l.length*p)-1)].gpa;
 const kc=(l1,l2,icon,title,big,sub)=>`<div class="info-card" style="--l1:${l1};--l2:${l2}"><span class="icon-wrap"><i class="fa-solid ${icon}"></i></span><div><span class="ic-title">${title}</span><div class="ic-big">${big}</div><span class="ic-line">${sub}</span></div></div>`;
 let h=pageTitle()+`<div class="icards" style="grid-template-columns:repeat(auto-fit,minmax(200px,1fr))">
  ${kc('#F5D0FE','#C7D2FE','fa-ranking-star','Bölüm Sırası',`${R.rank} <span style="font-size:13px;font-weight:400">/ ${R.n}</span>`,S.rf==='all'?'Tüm bölüm':'4. sınıf öğrencileri')}
  ${kc('#FDE68A','#FCE7F3','fa-percent','Yüzdelik Dilim',`%${R.pct}`,`${R.n-R.rank} öğrencinin önündesiniz`)}
  ${kc('#C7D2FE','#FCE7F3','fa-chart-line','AGNO',fmt(cur.v),`Bölüm ortalaması: ${fmt(avg)}`)}
  ${kc('#D1FAE5','#BFDBFE','fa-layer-group','Tamamlanan AKTS',PASSE,`/ ${TOTAL} AKTS`)}</div>`;
 const tg=[['İlk %50',.5],['İlk %25',.25],['İlk %10',.1],['Bölüm birincisi',1/l.length]].map(([n,p])=>{const g=thr(p),rem=TOTAL-PASSE,need=(g*(cur.e+rem)-cur.p)/rem;
  const ok=cur.v>=g;return`<tr><td><b>${n}</b></td><td>${fmt(g)}</td><td>${ok?'<span class="badge low">Ulaşıldı</span>':need>4?'<span class="badge full">Ulaşılamaz</span>':`<b>${fmt(need)}</b> <span class="small">(kalan ${rem} AKTS ortalaması)</span>`}</td></tr>`}).join('');
 const bins=[];for(let b=1.5;b<4;b+=.25)bins.push({a:b,n:l.filter(x=>x.gpa>=b&&x.gpa<b+.25).length,me:cur.v>=b&&cur.v<b+.25});
 const mx=Math.max(...bins.map(b=>b.n));
 const hist=`<div class="hist">${bins.map(b=>`<div class="hb${b.me?' me':''}" title="${fmt(b.a)}–${fmt(b.a+.24)}: ${b.n} öğrenci"><span class="hv">${b.n}</span><i style="height:${b.n/mx*100}%"></i><span class="hl">${fmt(b.a,2)}</span></div>`).join('')}</div>
  <div class="legend" style="margin-top:8px"><span><i style="background:#c4b5fd"></i>Öğrenci sayısı</span><span><i style="background:#a21caf"></i>Sizin aralığınız</span></div>`;
 const rows=l.map((x,i)=>`<tr class="${x.me?'me':''}"><td><b>${i+1}</b></td><td>${x.me?x.no:maskNo(x.no)}</td><td>${x.name}${x.me?' <span class="badge acc">Siz</span>':''}</td><td>${x.s}</td><td>${x.akts}</td><td><b>${fmt(x.gpa)}</b></td></tr>`).join('');
 const sel=`<div class="btn-group"><button class="btn sm ${S.rf==='4'?'':'outline'}" data-act="rf" data-v="4">4. Sınıf</button><button class="btn sm ${S.rf==='all'?'':'outline'}" data-act="rf" data-v="all">Tüm Bölüm</button></div>`;
 h+=`<div class="cols2"><div>${card('Makine Mühendisliği — AGNO Sıralaması','fa-list-ol',`<p class="hint">AGNO'ya göre sıralı; eşitlikte tamamlanan AKTS'si fazla olan önde. Diğer öğrencilerin bilgileri gizlenmiştir.</p>
  <div class="tblw rtw" id="rtw"><table class="grid"><thead><tr><th>Sıra</th><th>Öğrenci No</th><th>Ad Soyad</th><th>Sınıf</th><th>AKTS</th><th>AGNO</th></tr></thead><tbody>${rows}</tbody></table></div>`,sel)}</div>
  <div>${card('AGNO Dağılımı','fa-chart-column',hist)}${card('Sıralama Hedefleri','fa-bullseye',`<p class="hint">Hedef dilime girmek için gereken AGNO ve kalan derslerde tutturman gereken ortalama.</p>
  <div class="tblw"><table class="grid"><tr><th>Hedef</th><th>Gereken AGNO</th><th>Gereken ortalama</th></tr>${tg}</table></div>`)}</div></div>`;
 return h}
function setPlan(p){S.plan={...p};const valid=new Set(Object.keys(S.plan));Object.keys(S.exp).forEach(k=>{if(!valid.has(k))delete S.exp[k]})}

document.addEventListener('click',e=>{const el=e.target.closest('[data-tab],[data-act]');if(!el)return;
 if(el.dataset.tab){S.tab=el.dataset.tab;document.body.classList.remove('menu-open');render();window.scrollTo(0,0);return}
 const a=el.dataset.act;
 if(a==='res'){S.ri=+el.dataset.i;render()}
 else if(a==='activate'){setPlan(S.results[S.ri].plan);toast('<i class="fa-solid fa-check"></i> Aktif program güncellendi');render()}
 else if(a==='drop'){S.selected.delete(el.dataset.c);generate();render()}
 else if(a==='watch'){const id=el.dataset.id;S.watch.has(id)?S.watch.delete(id):S.watch.add(id);toast(S.watch.has(id)?`<i class="fa-solid fa-bell"></i> ${id.replace(':','(').replace(/(\d+)$/,n=>+n+1+')')} takibe alındı`:'Takip bırakıldı');render()}
 else if(a==='apply'){const from=el.dataset.from,c=el.dataset.c,i=+el.dataset.i;const p={...S.plan};if(c!==from)delete p[from];p[c]=i;setPlan(p);
  S.selected=new Set(Object.keys(p));generate();toast(`<i class="fa-solid fa-check"></i> ${c} Şube ${i+1} programına eklendi`);render()}
 else if(a==='sim')toggleSim();
 else if(a==='chain'){S.chain=el.dataset.c&&S.chain!==el.dataset.c?el.dataset.c:null;render()}
 else if(a==='grp'){const g=el.dataset.g;S.open.has(g)?S.open.delete(g):S.open.add(g);renderMenu()}
 else if(a==='stub')toast(`<b>${el.dataset.t||el.querySelector('b').textContent}</b> gerçek OBS'de açılır. Bu prototipte yalnızca Akıllı Asistan sayfaları çalışır.`);
 else if(a==='alertoff'){S.alertOff=true;render()}
 else if(a==='rf'){S.rf=el.dataset.v;render()}});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.act;
 if(a==='course'){el.checked?S.selected.add(el.dataset.c):S.selected.delete(el.dataset.c);generate();render()}
 else if(a==='pref'){S.prefs[el.dataset.k]=el.checked;generate();render()}
 else if(a==='qf'){S.qf=el.value;render()}
 else if(a==='exp'){S.exp[el.dataset.c]=el.value;render()}});
document.addEventListener('input',e=>{
 if(e.target.id==='msearch'){S.ms=e.target.value;renderMenu()}
 if(e.target.id==='qq'){S.qq=e.target.value;$('#qtable').innerHTML=quotaTable()}
 if(e.target.id==='target'){const v=parseFloat(e.target.value);if(v>=1&&v<=4){S.target=v;save();
  const exp={};Object.keys(S.plan||{}).forEach(c=>exp[c]=S.exp[c]);$('#tout').innerHTML=targetMsg(gpa(grades(exp)))}}});
$('#hamb').onclick=()=>document.body.classList.toggle('menu-open');
$('#backdrop').onclick=()=>document.body.classList.remove('menu-open');
$('#bellTop').onclick=()=>{S.notes=0;$('#ncount').textContent='0';S.tab='quota';S.qf='watch';render()};

/* ---------- CANLI KONTENJAN SİMÜLASYONU ---------- */
function note(msg){S.notes++;$('#ncount').textContent=S.notes;toast(msg)}
function toggleSim(){if(S.sim){clearInterval(S.sim);S.sim=null;render();return}
 S.sim=setInterval(()=>{for(const[c,secs]of Object.entries(OFFER))secs.forEach((s,i)=>{const wasFull=s.enr>=s.cap,id=c+':'+i;
  if(Math.random()<s.rate/5&&s.enr<s.cap)s.enr++;
  if(Math.random()<(wasFull?.06:.03)&&s.enr>0)s.enr--;
  if(S.watch.has(id)){if(wasFull&&s.enr<s.cap)note(`<i class="fa-solid fa-bell"></i> <b>${c}(${i+1})</b> şubesinde yer açıldı! (${s.enr}/${s.cap})`);
   else if(!wasFull&&s.enr>=s.cap)note(`<b>${c}(${i+1})</b> şubesi doldu.`)}});
  if(S.tab==='quota'){const y=window.scrollY,q=$('#qq'),focus=document.activeElement===q,pos=q&&q.selectionStart;render();window.scrollTo(0,y);
   if(focus){const n=$('#qq');n.focus();n.setSelectionRange(pos,pos)}}},1500);render()}

/* ---------- OTURUM SAYACI & BAŞLAT ---------- */
let left=3600;setInterval(()=>{left=Math.max(0,left-1);$('#timer').textContent=pad(Math.floor(left/60))+':'+pad(left%60)},1000);
document.addEventListener('click',()=>{left=3600},true);
load();generate();if(!S.plan&&S.results.length)setPlan(S.results[0].plan);render();
</script>
</body>
